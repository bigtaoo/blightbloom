<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <!-- The browser's own chrome (mobile address bar, task switcher) takes its colour from
         this, so the frame around a loading page matches it instead of flashing white. -->
    <meta name="theme-color" content="#0b0d12" />
    <title>Blightbloom</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; }
      /* No text selection, no long-press magnifier, no double-tap zoom, no touch scroll.
         Asked for by name in the CrazyGames technical requirements ("add CSS to prevent
         magnification/selection"), and correct on every other target too: every drag in
         this game is a control input, so a browser gesture reading one as a selection or a
         pan is always a lost input rather than a feature. */
      html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
      canvas { display: block; touch-action: none; }
      /* ## The boot splash
         Paints on the browser's first paint of this document — before `main.ts` is fetched,
         before Pixi exists, before a WebGL context does. That is most of the wait it covers:
         on the live deploy the bundle alone is ~290 kB gzipped. Everything here is inline
         and static for that reason; the only part that needs the running game is the bar's
         width and the removal, which `src/bootSplash.ts` does.

         It comes down on `src/bootSplash.ts`'s terms, and as soon as those are met: after
         the renderer has drawn a real frame, with no minimum in front of it. This page is
         the way IN — the minimum-display rule belongs to the in-game transitions instead
         (`src/game/controllers/TransitionGate.ts`). The fade below is the last step. */
      #boot-loading {
        position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px; background: #0b0d12;
        color: #90cdf4; font-family: monospace; font-size: 14px; letter-spacing: 1px;
        transition: opacity 320ms ease;
      }
      #boot-loading.is-hiding { opacity: 0; }
      #boot-loading .brand {
        font-size: 22px; letter-spacing: 6px; color: #e2e8f0; font-weight: bold;
      }
      #boot-loading .spinner {
        width: 40px; height: 40px; border-radius: 50%;
        border: 3px solid #2a3140; border-top-color: #90cdf4;
        animation: boot-spin 0.8s linear infinite;
      }
      /* The bar is a real measure of the boot, not a timed animation: `setBootProgress`
         drives it from the renderer coming up and the `lobby` pack landing. Its transition
         is what keeps a jump from one stage to the next from reading as a glitch. */
      #boot-loading .track {
        width: 220px; height: 4px; background: #2a3140; border-radius: 2px; overflow: hidden;
      }
      #boot-loading .fill {
        width: 0%; height: 100%; background: #90cdf4; transition: width 220ms ease;
      }
      /* Revealed by the clock alone, so it still appears when the bundle never arrives and
         no script of ours is ever going to run. That case used to be an infinite spinner
         with nothing to say about itself. */
      #boot-loading .slow {
        color: #718096; font-size: 12px; letter-spacing: 0; max-width: 80vw; text-align: center;
        opacity: 0; animation: boot-slow-hint 0.4s ease 15s forwards;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-slow-hint { to { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="boot-loading">
      <div class="brand">BLIGHTBLOOM</div>
      <div class="spinner"></div>
      <div class="track"><div id="boot-progress" class="fill"></div></div>
      <div>Loading… / 加载中…</div>
      <div class="slow">Still loading — check your connection. / 仍在加载，请检查网络连接。</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
