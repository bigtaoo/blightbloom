<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Blightbloom</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; }
      /* No text selection, no long-press magnifier, no double-tap zoom, no touch scroll.
         Asked for by name in the CrazyGames technical requirements ("add CSS to prevent
         magnification/selection"), and correct on every other target too: every drag in
         this game is a control input, so a browser gesture reading one as a selection or a
         pan is always a lost input rather than a feature. */
      html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
      canvas { display: block; touch-action: none; }
      /* Boot splash: paints immediately on page load, well before main.ts runs or
         Pixi's WebGL context exists — removed by main.ts once game.start() fires. */
      #boot-loading {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 16px; background: #0b0d12; color: #90cdf4;
        font-family: monospace; font-size: 14px; letter-spacing: 1px;
      }
      #boot-loading .spinner {
        width: 40px; height: 40px; border-radius: 50%;
        border: 3px solid #2a3140; border-top-color: #90cdf4;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot-loading"><div class="spinner"></div><div>Loading… / 加载中…</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
