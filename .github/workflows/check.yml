# Repo-wide verification. Until this existed, `.github/workflows/` held only deploy
# workflows — nothing ran the tests on a push, so every gate in the repo was a gate only
# for whoever remembered to run it locally.
#
# Four jobs, split by cost and by what a failure MEANS rather than by kind:
#
#   logic    — the logic-consistency gates, by name (build/logicConsistency.mjs). Seconds,
#              and first, because it is the fastest way to learn that a change altered sim
#              behaviour: a red `logic` with a green `check` says the code is fine and the
#              BEHAVIOUR moved, which is a different conversation from a broken build.
#   check    — typecheck, the 500-line drift gate, the WeChat package-size gate, the doc-path
#              gate, and the full unit suite across every workspace. Seconds, so it runs on
#              everything — plus one cold-machine cost since 2026-09-15: the server suite runs
#              against a real mongod (design/18 "Layer 4"), whose ~64MB binary is cached below
#              rather than downloaded twice per push.
#   coverage — the same suites again under v8 instrumentation, then the 90% line / 90% branch
#              gate over client, engine and server (build/checkCoverageThreshold.mjs).
#              Minutes; see that job's own comment for why it runs on every event anyway.
#   sims     — the three `.sim.ts` suites (`test:pvp-sim`, `test:pve-sim`, `test:drop-sim`).
#              They play real bot-driven matches and carry the level's survivability gates
#              (design/05 "Room encounter budget"), which is exactly what a geometry or enemy
#              change can break without failing a single unit test. Minutes.
#
# Every job is independent on purpose: when a geometry change breaks a balance gate we want
# to see ALL the results, not have the slow ones skipped because the fast one went red.
#
# See design/18-test-strategy.md for what each layer of the suite is for.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A second push to the same branch supersedes the first — no point finishing a run whose
  # commit is already stale.
  group: check-${{ github.ref }}
  cancel-in-progress: true

# Nothing in CI runs Electron, and until 2026-09-21 every job downloaded it anyway.
#
# `electron` is a devDependency of `tools/desktop-shell`, so a root `npm ci` runs its
# postinstall, which fetches a ~100MB platform binary from `github.com/electron/electron`
# releases. That download is on the critical path of ALL FIVE workflows in this directory
# and is cached by nothing: `actions/setup-node`'s `cache: npm` caches the npm cache, while
# Electron writes to `~/.cache/electron` on its own. So it is a fresh cross-internet fetch
# per job, per push, forever — and on 2026-09-21 it answered `504 Gateway Time-out` twice in
# two consecutive runs, failing `sims` in 30 seconds with no simulation executed. A red gate
# that says nothing about the code is worse than a slow one.
#
# Skipping it costs nothing here, and the reason is checkable rather than asserted: all nine
# `tools/desktop-shell/src/*.test.ts` files mock the module with a FACTORY
# (`vi.mock('electron', () => ...)`), so vitest never loads the real one. Verified by hiding
# `node_modules/electron/{path.txt,dist}` — the exact state this variable produces — and
# running that suite: 81 tests, 9 files, green.
#
# The npm package itself is still installed, so module resolution is unaffected; only the
# binary is skipped. **What re-opens this question** is a test (or a build step) that
# actually launches Electron rather than mocking it — and that failure is already gated,
# because `npm run check` runs desktop-shell's own suite across the workspaces and would go
# red here rather than silently passing.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  # The named consistency step. `npm run check` below already runs every one of these tests,
  # which is precisely why this job exists separately: inside a 6,000-test summary, a gate
  # that stops running looks like nothing at all. Here the step's own name is the claim, and
  # the manifest fails closed if any gate it names has been renamed or deleted.
  logic:
    name: logic consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:logic

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` runs postinstall scripts that this repo gates behind npm 11's allowScripts
      # (esbuild's platform binary; electron's binary download is allowed there too but is
      # skipped in CI by the workflow-level env above). The allow list lives in the root
      # package.json, so a plain `npm ci` is enough.
      - run: npm ci
      # The suite's mongod, cached. `mongodb-memory-server` downloads ~64MB the first time a
      # machine runs a test that touches a store (server/test/mongoGlobalSetup.ts), which is
      # every run of this job — so without this the download is a minute on the critical path
      # of two of the four gates, every push, forever.
      #
      # Keyed on the PINNED version rather than on a lockfile hash: the binary is chosen by
      # `mongoGlobalSetup.ts`'s `binary: { version }` and by nothing else, so a dependency
      # bump must not invalidate it and a version bump must. Keeping the two in step is what
      # the literal below is for — `npm run check` fails loudly on a missing binary, not
      # silently on a stale one, so the worst case of a mismatch is a slow job.
      - name: cache the mongod binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-7.0.14
      - run: npm run check

  # Coverage on EVERY event, including pull requests — deliberately, and it is the expensive
  # choice. The sibling project `funny` ran coverage only on the pre-deploy push for exactly
  # the cost reason, and recorded what that bought: a coverage regression could only be caught
  # by the merge that shipped it, never by the PR that caused it. Since the bars are 90/90 and
  # the client sits ~2 points over on branches, one unexercised `if` is all it takes — so the
  # PR that adds it is the only useful place to say so.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The suite's mongod, cached. `mongodb-memory-server` downloads ~64MB the first time a
      # machine runs a test that touches a store (server/test/mongoGlobalSetup.ts), which is
      # every run of this job — so without this the download is a minute on the critical path
      # of two of the four gates, every push, forever.
      #
      # Keyed on the PINNED version rather than on a lockfile hash: the binary is chosen by
      # `mongoGlobalSetup.ts`'s `binary: { version }` and by nothing else, so a dependency
      # bump must not invalidate it and a version bump must. Keeping the two in step is what
      # the literal below is for — `npm run check` fails loudly on a missing binary, not
      # silently on a stale one, so the worst case of a mismatch is a slow job.
      - name: cache the mongod binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-7.0.14
      - name: run every suite under v8 instrumentation
        id: measure
        run: npm run test:coverage
      # Both of the steps below run even when the one above failed, and they read the same
      # `evaluate` call so they cannot disagree. TESTS_OK is how the gate is told that a
      # missing coverage/ directory here is a CONSEQUENCE of a failed test run rather than a
      # broken coverage step — it fails closed otherwise, on purpose.
      - name: coverage report
        if: always()
        env:
          TESTS_OK: ${{ steps.measure.outcome == 'success' }}
        run: node build/coverageReport.mjs
      - name: 90% line / 90% branch gate
        if: always()
        env:
          TESTS_OK: ${{ steps.measure.outcome == 'success' }}
        run: node build/checkCoverageThreshold.mjs
      # Kept even on failure: the HTML report is how you find WHICH lines, and a failed gate
      # is exactly when someone wants it.
      - name: upload coverage html
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            client/coverage
            engine/coverage
            server/coverage
          retention-days: 7
          if-no-files-found: warn

  sims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:sims
