name: client-deploy

# Auto-publish the game client (static web build, Worker daydayup-client) to Cloudflare,
# served at b.gamestao.com.
# Trigger: push to main touching client/engine source or this workflow/config, or manual
# Run from the Actions page.
# Flow: npm ci (root, npm workspaces) → npm run build -w client → wrangler deploy.
# Mirrors the funny project's client-deploy.yml — see that repo's
# design/product/deploy-cloudflare.md §6 for the account/pattern this reuses.
#
# Reuses the gamestao.com Cloudflare account (same one funny uses for a.gamestao.com etc.):
#   CLOUDFLARE_API_TOKEN   — repo secret, needs at least Workers Scripts:Edit (account-level;
#                            funny's "Edit Cloudflare Workers" token already covers this,
#                            no new token required)
#   CLOUDFLARE_ACCOUNT_ID  — repo secret, Cloudflare account id
# Enable switch: repo variable CLIENT_DEPLOY_ENABLED = true (job skipped if not set, to avoid
# red builds before setup is complete).

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      # The client build reads the deterministic engine as source via the vite alias
      # @dd/engine → engine/src (build/ddAlias.mjs), so an engine-only change still ships
      # to players only through this client bundle and must retrigger the deploy.
      - 'engine/**'
      - 'wrangler/client.jsonc'
      - '.github/workflows/client-deploy.yml'
  workflow_dispatch: {}

# Only one client deployment runs at a time; new run cancels the old one.
concurrency:
  group: client-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip the entire job if repo variable CLIENT_DEPLOY_ENABLED is not 'true'.
    if: ${{ vars.CLIENT_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Single root lockfile (npm workspaces) — install from repo root, not client/.
      - name: install
        run: npm ci

      - name: build client
        # The backend's origin is a BUILD-time value (client/src/game/runState.ts reads
        # import.meta.env.VITE_MATCHSVC_URL) — unset means every deployed build silently
        # falls back to localhost:8788 and online co-op/PvP just never connects, with no
        # error (client/.env.example, server/deploy/README.md §3).
        env:
          VITE_MATCHSVC_URL: ${{ vars.MATCHSVC_URL }}
        run: npm run build -w client

      # Run from repo root using -c to specify the client config (assets point to
      # ./client/dist, no Worker script). Uses npx wrangler directly so errors are
      # visible as-is.
      - name: deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.118.0 deploy -c wrangler/client.jsonc
