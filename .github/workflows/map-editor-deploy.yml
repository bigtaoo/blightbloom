name: map-editor-deploy

# Auto-publish the map-editor authoring tool (static web build, Worker
# daydayup-map-editor) to Cloudflare, served at dd-map.gamestao.com.
# Trigger: push to main touching the map-editor/engine source or this workflow/config, or manual
# Run from the Actions page.
# Flow: npm ci (root, npm workspaces) → npm run build -w tools/map-editor → wrangler deploy.
# Mirrors client-deploy.yml — see that workflow / wrangler/client.jsonc for the
# account/pattern this reuses.
#
# Reuses the gamestao.com Cloudflare account (same secrets as client-deploy.yml):
#   CLOUDFLARE_API_TOKEN   — repo secret, needs at least Workers Scripts:Edit
#   CLOUDFLARE_ACCOUNT_ID  — repo secret, Cloudflare account id
# Enable switch: repo variable MAP_EDITOR_DEPLOY_ENABLED = true (job skipped if not set,
# to avoid red builds before setup is complete).

on:
  push:
    branches: [main]
    paths:
      - 'tools/map-editor/**'
      # The map-editor build consumes the engine source directly (RoomPiece/ArenaMap
      # schema, via the vite alias @dd/engine → engine/src), so an engine-only change
      # still ships to this tool only through its own build and must retrigger the deploy.
      - 'engine/**'
      - 'build/versionManifestPlugin.mjs'
      - 'wrangler/map-editor.jsonc'
      - '.github/workflows/map-editor-deploy.yml'
  workflow_dispatch: {}

# Only one map-editor deployment runs at a time; new run cancels the old one.
concurrency:
  group: map-editor-deploy
  cancel-in-progress: true

# Electron's ~100MB postinstall binary, skipped: it is a devDependency of
# `tools/desktop-shell`, which this workflow does not build, and its download is an uncached
# cross-internet fetch that has failed CI with a 504. See `check.yml`'s own comment for the
# full reasoning and how it was verified.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip the entire job if repo variable MAP_EDITOR_DEPLOY_ENABLED is not 'true'.
    if: ${{ vars.MAP_EDITOR_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Single root lockfile (npm workspaces) — install from repo root, not tools/map-editor.
      - name: install
        run: npm ci

      - name: build map-editor
        run: npm run build -w tools/map-editor

      # Run from repo root using -c to specify the map-editor config (assets point to
      # ./tools/map-editor/dist, no Worker script). Uses npx wrangler directly so errors
      # are visible as-is.
      - name: deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.118.0 deploy -c wrangler/map-editor.jsonc
