# The backend's whole deployment: one compose project on a DEDICATED Hetzner CX23
# (`blightbloom`, 62.238.1.182, Helsinki), living at `~/blightbloom`. Nothing else runs on
# this box. Full runbook: server/deploy/README.md.
#
# **This file used to describe a box this project only borrowed** — the company's
# `wnet-server`, shared with their wnet stack and with `deutsch-sync` — and three things
# here were shaped by that rather than by what the services need. All three changed when
# the project moved onto its own hardware, 2026-09-15:
#
#  - It joined the host's existing `docker_default` network, because the host's Caddy had
#    to resolve our containers by name. There is no host stack to join now: the network is
#    ours (`bb`, at the bottom) and so is the proxy — the `caddy` service, the only one in
#    this file that publishes a host port.
#  - Everything visible on the box was named `wnet-test` instead of after this project, to
#    keep a low profile on somebody else's hardware. The box is ours; the containers are
#    `bb-*`. The disguise cost nothing while it was true and is actively misleading now.
#  - Prometheus scraped the HOST's cAdvisor and node-exporter rather than standing up a
#    second privileged copy on borrowed hardware. There is nothing to borrow any more, so
#    this file runs its own (`obs-cadvisor`, `obs-node-exporter`) and the infra dashboard
#    stops depending on containers another team can rename.
#
# One image (server/Dockerfile, built from the ALREADY-BUILT server/dist/*.mjs —
# `npm run build -w server` first), FIVE processes selected by `command:` — four HTTP
# services and one worker (`backup`), which has no port and whose healthcheck therefore
# asks its own bundle rather than a `/health` route.
#
# ── ...plus the off-the-shelf images ──
# `caddy` — the public edge, TLS and the four-way path split (server/deploy/README.md §2) —
# and the observability stack (design/19 §10): `obs-loki` / `obs-alloy` / `obs-prometheus` /
# `obs-grafana` / `obs-cadvisor` / `obs-node-exporter`. None of them runs code from this
# repo. Caddy is listed apart from the rest because the sentence that covers them does not
# cover it: a dead Grafana cannot affect a match, and a dead Caddy is a total outage.
#
# Three things about this half are load-bearing:
#
#  - **The `obs-` prefix stays, now as a role marker rather than a collision guard.** It
#    existed because a service called `loki` on the SHARED network would have put two
#    containers behind the box owner's own `loki` alias, with pushes landing in the wrong
#    store intermittently and nothing failing anywhere. That hazard left with the box. The
#    prefix stays because it is what makes `docker compose ps` legible at a glance — which
#    half serves players, which half watches them — and dropping it would rewrite every
#    scrape target, datasource and dashboard to buy nothing.
#  - **All observability state lives in NAMED volumes, never a bind mount.** Docker creates
#    a missing bind-mount source `root:root` and the mount then hides the image's own
#    `chown` — which is what cost this deployment 18 hours of silently failing backups on
#    2026-09-08. These images run as their own uids (Loki 10001, Grafana 472), so a
#    bind-mounted data dir would need a third ownership rule in `ci-deploy.sh`. A named
#    volume is owned by whoever writes it first. Only read-only CONFIG is bind-mounted.
#  - **Grafana is one of the two things here a human logs into** (`adminsvc` below is the
#    other), and Caddy exposes it at `/grafana*` — server/deploy/README.md §2. Its admin
#    password comes from `.env`, which CI never ships, and self-registration is off.
services:
  gameserver:
    build: .
    image: blightbloom:latest
    container_name: bb-gameserver
    command: ["node", "index.mjs"]
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8787"
      NODE_ENV: production
      BB_LOG_LEVEL: info
      BB_MATCHSVC_URL: http://matchsvc:8788
    expose:
      - "8787"
    networks:
      - bb
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  matchsvc:
    build: .
    image: blightbloom:latest
    container_name: bb-matchsvc
    command: ["node", "matchsvc.mjs"]
    restart: unless-stopped
    env_file: .env
    environment:
      MATCH_PORT: "8788"
      NODE_ENV: production
      BB_LOG_LEVEL: info
      # Where `POST /client/log` forwards a browser's log batch (src/lokiPush.ts). Unset is
      # a real state and a quiet one — the route still answers 200, the client sees no
      # error, and the dashboards stay empty in a way that looks exactly like a quiet week.
      # funny shipped precisely that for months, which is why an unset value here produces a
      # WARN on the first push rather than being ignored.
      BB_LOKI_PUSH_URL: http://obs-loki:3100/loki/api/v1/push
      # Public address a client's issued ticket gets redeemed against — NOT the internal
      # gameserver:8787 hop, this is what the browser itself opens a WebSocket to.
      BB_GAMESERVER_URL: wss://bb.gamestao.com/ws
      BB_BILLSVC_URL: http://billsvc:8789
      BB_DB_PATH: /data/accounts.db
      # Analytics (design/21 §2.4). SETTING this is what switches collection on: matchsvc
      # has no default path for it, deliberately, because an implicit default would collect
      # into a file the backup service below does not know about — and "collected" and
      # "backed up" would then be two conditions that can quietly disagree. Beside
      # accounts.db on the same mount, so one volume covers both and a snapshot of the box
      # holds a consistent pair.
      BB_ANALYTICS_DB_PATH: /data/analytics.db
      # Where to poll for feature flags (design/21 §4, src/flags/client.ts). Unset would be
      # a complete and supported state — every value then comes from `flags/defs.ts` — so
      # this line is the opt-in, not a requirement. The poll carries `x-internal-key`, so it
      # is the same trust seam design/19 §3 already built, and a 401/timeout/garbled body
      # all leave the compiled-in defaults in place.
      BB_ADMINSVC_URL: http://adminsvc:8790
    volumes:
      - ./data/matchsvc:/data
    expose:
      - "8788"
    networks:
      - bb
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  billsvc:
    build: .
    image: blightbloom:latest
    container_name: bb-billsvc
    command: ["node", "billsvc.mjs"]
    restart: unless-stopped
    env_file: .env
    environment:
      BILL_PORT: "8789"
      BB_LOG_LEVEL: info
      # Deliberately NOT production: no real Paddle credential exists yet
      # (design/19-server-platform.md §9), and billsvc/startupGuard.ts refuses to boot a
      # dev-stub flag under NODE_ENV=production, full stop, by design. This process is
      # reachable ONLY from matchsvc over the internal network — never through Caddy.
      NODE_ENV: development
      BB_BILLING_DEV_STUB: "1"
      BB_BILLING_DB_PATH: /data/billing.db
    volumes:
      - ./data/billsvc:/data
    expose:
      - "8789"
    networks:
      - bb
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8789/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The ops console (design/21 §3, decision B1) — the FIFTH process and the second one a
  # human logs into, at https://bb.gamestao.com/admin/ beside Grafana.
  #
  # Two properties are worth reading straight off this block, because they are the whole
  # security argument and neither is visible in the code:
  #
  #  - **Every mount is `:ro`, and there is no writable mount at all.** The process also
  #    opens all three files with `readOnly: true` (src/adminsvc/dbs.ts), so it is refused
  #    twice over — by SQLite and by the kernel. That is what lets B1 be stated as "it
  #    cannot write player data" rather than "it does not". Mounted under `/sources/` for
  #    the same reason the backup worker's are: the role is then visible in every path in
  #    the logs.
  #  - **It has no `.env`-independent default credential.** `BB_ADMIN_PASSWORD` uses the
  #    same `:?` form Grafana's does, so a box whose `.env` predates this service fails
  #    `compose up` rather than booting a login page with a compiled-in password on the
  #    public internet. `deploy/ci-deploy.sh` checks for it by name first, so the deploy log
  #    says which value is missing instead of leaving compose's own interpolation error as
  #    the only clue.
  #
  # It joins no other service: nothing calls it and it calls nothing. `BB_MATCHSVC_URL` and
  # friends are deliberately absent — the console reads databases, not APIs.
  adminsvc:
    build: .
    image: blightbloom:latest
    container_name: bb-adminsvc
    command: ["node", "adminsvc.mjs"]
    restart: unless-stopped
    env_file: .env
    environment:
      ADMIN_PORT: "8790"
      NODE_ENV: production
      BB_LOG_LEVEL: info
      # No default and no fallback, exactly as Grafana's password has none. `:?` makes a
      # missing value fail `compose up`; src/adminsvc/credentials.ts ALSO refuses to boot
      # without it, because this process is run from `npm` and from a test as well as from
      # compose and one guard per entry point is one guard that can be bypassed.
      BB_ADMIN_PASSWORD: ${BB_ADMIN_PASSWORD:?set BB_ADMIN_PASSWORD in .env (openssl rand -hex 16)}
      # The three files, at the read-only paths below. Same variable names their OWNING
      # services use (the reason src/backup/config.ts gives): "which file is this" must be
      # one fact with one name, not one per reader.
      BB_DB_PATH: /sources/matchsvc/accounts.db
      BB_BILLING_DB_PATH: /sources/billsvc/billing.db
      BB_ANALYTICS_DB_PATH: /sources/matchsvc/analytics.db
      # The FOURTH database and the only one this process can write (design/21 §4,
      # src/flags/store.ts). Its own directory, its own mount, NOT `:ro`, and deliberately
      # not under `/sources/`: the path itself is what says which handles are read-only and
      # which one is not. Nothing about a player is in it — one row per feature flag,
      # holding a name this repo declared and a value this repo validated — so B1's sentence
      # ("cannot write player data") stays exactly true.
      #
      # SETTING this is what switches flags on, the same way BB_ANALYTICS_DB_PATH switches
      # collection on: unset means the flags tab says so, /internal/flags answers 503, and
      # every service runs on its compiled-in defaults, which is the shipped behaviour.
      BB_OPS_DB_PATH: /data/ops.db
    volumes:
      - ./data/matchsvc:/sources/matchsvc:ro
      - ./data/billsvc:/sources/billsvc:ro
      - ./data/adminsvc:/data
    expose:
      - "8790"
    networks:
      - bb
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # `/admin/health` rather than `/health`: every path this process answers is under
    # `/admin` so that ONE Caddy `handle` block covers the whole console. The route refuses
    # a request carrying `x-forwarded-for` (i.e. one that came through Caddy) the same way
    # matchsvc's `/metrics` does, so this probe works only from inside the container —
    # which is exactly where a healthcheck runs.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/admin/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The only process here that serves nothing. It snapshots the two databases this project
  # cannot regenerate — accounts.db (who somebody is) and billing.db (what they paid for) —
  # because until 2026-09-07 the backup procedure was a `scp` line in a README, i.e. a
  # procedure only as reliable as somebody remembering it.
  #
  # Two properties worth reading off this block:
  #
  #  - **The source mounts are `:ro`.** `VACUUM INTO` works through a read-only SQLite
  #    handle (verified, see src/backup/snapshot.ts), so this container cannot write to a
  #    live database even if its code were wrong. They are mounted under `/sources/` rather
  #    than `/data/` so that role is visible in every path in the logs.
  #  - **The healthcheck is real logic, not a ping.** `node backup.mjs --health` reads
  #    `status.json` and fails when any source failed OR when the last cycle is too old —
  #    so a worker whose loop died after one good cycle goes unhealthy instead of staying
  #    green forever on a stale success.
  backup:
    build: .
    image: blightbloom:latest
    container_name: bb-backup
    command: ["node", "backup.mjs"]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      BB_LOG_LEVEL: info
      # Same variable names the owning services use for these files (src/backup/config.ts
      # explains why), pointed at this container's read-only mounts.
      BB_DB_PATH: /sources/matchsvc/accounts.db
      BB_BILLING_DB_PATH: /sources/billsvc/billing.db
      # The third source. Its loss is survivable where the other two are not — analytics can
      # be re-collected and identity cannot — so it is here for the reason the alternative is
      # worse: a per-source exception costs a special case in `prunable`, in the health
      # arithmetic and in this file, and buys back a few kilobytes a day.
      BB_ANALYTICS_DB_PATH: /sources/matchsvc/analytics.db
      # `ops.db` is deliberately NOT a fourth backup source. Every row in it is a value an
      # operator typed, over a default that is in git — so a lost `ops.db` costs the current
      # override set, which the console shows and a human can retype in a minute, and
      # nothing that cannot be reconstructed. The other three hold identity, money and
      # measurement. Adding it would mean a `:ro` mount, a `SOURCE_VARS` entry and a fourth
      # line in the health arithmetic, to protect four rows of typed input.
      BB_BACKUP_DIR: /backups
      BB_BACKUP_INTERVAL_HOURS: "24"
      BB_BACKUP_KEEP: "14"
    volumes:
      - ./data/matchsvc:/sources/matchsvc:ro
      - ./data/billsvc:/sources/billsvc:ro
      - ./backups:/backups
    networks:
      - bb
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "backup.mjs", "--health"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 60s

  # ──────────────────────────── observability (design/19 §10) ────────────────────────────

  # The log store for BOTH halves: the four containers above (via obs-alloy) and the
  # browser client (via matchsvc's /client/log). 14-day retention, filesystem storage, no
  # published port — Grafana reaches it over this network and nothing else can.
  obs-loki:
    image: grafana/loki:3.4.2
    container_name: bb-loki
    command: ["-config.file=/etc/loki/config.yml"]
    restart: unless-stopped
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    expose:
      - "3100"
    networks:
      - bb
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Reads container stdout off the Docker socket and pushes it to obs-loki. The socket is
  # mounted READ-ONLY, and monitoring/alloy/config.alloy still filters discovery to a name
  # prefix — `bb-` now. On the borrowed box that filter was a boundary: the other
  # containers on it belonged to another team and were not ours to collect. Here it is
  # merely tidy, and it is kept because the failure it prevents did not go away with the
  # box — an unfiltered collector picks up whatever a future `docker run` leaves on this
  # host, and the first symptom is a Loki bill, not an error.
  obs-alloy:
    image: grafana/alloy:v1.7.5
    container_name: bb-alloy
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data", "--server.http.listen-addr=0.0.0.0:12345"]
    restart: unless-stopped
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    expose:
      - "12345"
    networks:
      - bb
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # NO healthcheck — the one service here without one, and worth the paragraph, because
    # "the collector is quietly dead" is the exact failure this whole stack exists to end.
    #
    # A Docker healthcheck runs INSIDE the container, and this image ships no HTTP client at
    # all: no wget, no curl, no nc, no busybox, and its /bin/sh is dash, so not even bash's
    # /dev/tcp. The obvious probe against its own /-/ready therefore exits 127 forever — a
    # container that is working perfectly, reported permanently unhealthy, which is worse
    # than no check because it trains everyone to ignore that column. Found on the first
    # deploy, 2026-09-09, by the container sitting in a restart loop.
    #
    # Its liveness is a Prometheus target instead: `up` for `svc="alloy"`, scraped over the
    # network by obs-prometheus, shown on the first panel of the "Server status" dashboard
    # and asserted by `deploy/ci-deploy.sh` after every deploy. That is a STRONGER check
    # than a self-probe — it proves the endpoint answers AND that the container is reachable
    # by name — and all it costs is the word in `docker compose ps`.

  # Metrics. Runs NO exporters of its own: it scrapes each service's own /metrics plus the
  # box's already-running cAdvisor and node-exporter — see monitoring/prometheus/prometheus.yml
  # for why standing up a second privileged cAdvisor on borrowed hardware is the wrong trade.
  obs-prometheus:
    image: prom/prometheus:v3.13.3
    container_name: bb-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=0.0.0.0:9090
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    networks:
      - bb
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # The only container here a person opens, at https://bb.gamestao.com/grafana/ behind its
  # own admin login (server/deploy/README.md §2). Datasources and dashboards are PROVISIONED
  # from the read-only mounts, so a fresh volume comes up already working and a dashboard is
  # a reviewed file rather than something somebody clicked into existence on a live box.
  obs-grafana:
    image: grafana/grafana:11.5.2
    container_name: bb-grafana
    restart: unless-stopped
    env_file: .env
    environment:
      # Served under a PATH, not a subdomain: another hostname on a box this project only
      # borrows means another DNS record and another certificate for its owner to wonder about.
      GF_SERVER_ROOT_URL: https://bb.gamestao.com/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      # From .env, the one file CI never ships (deploy/ci-deploy.sh). No default and no
      # fallback on purpose — Grafana's own is admin/admin, and this login page is on the
      # public internet. `:?` makes a missing value fail `compose up` rather than boot one.
      GF_SECURITY_ADMIN_PASSWORD: ${BB_GRAFANA_ADMIN_PASSWORD:?set BB_GRAFANA_ADMIN_PASSWORD in .env}
      # A public login page with self-registration is an open account factory.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    networks:
      - bb
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ──────────────────────────────── the public edge ────────────────────────────────────
  #
  # The ONLY container in this file that publishes a host port, and the only one whose
  # death is a total outage. It arrived with the move to dedicated hardware, 2026-09-15 —
  # on the borrowed box this role was played by the host owner's Caddy, and this project's
  # entire footprint on it was one appended site block in a Caddyfile we did not own.
  #
  # Three things worth reading off this block:
  #
  #  - **`./caddy` is mounted as a DIRECTORY, not as `./caddy/Caddyfile` as a file.** A
  #    single-file bind mount binds to that file's INODE, and `deploy/ci-deploy.sh` replaces
  #    shipped config by `rm -rf` + `cp -R`, which produces a new inode every time. The host
  #    file would then be correct while the container kept serving the old one, and — this
  #    is the part that cost a full diagnosis on 2026-09-09 — `caddy validate` and
  #    `caddy reload` would both read the stale inode and report success. A directory mount
  #    has the same hazard, which is why the deploy carries `--force-recreate`: recreating
  #    the container re-resolves the mount against the current path. Belt and braces.
  #  - **No `:ro` on the data volumes, `:ro` on the config.** `caddy-data` holds the ACME
  #    account key and every issued certificate; losing it means re-issuing on next boot and
  #    burning Let's Encrypt rate limit for nothing, so it is a named volume rather than
  #    something a redeploy can clear.
  #  - **Port 80 is published and must stay that way, and NOT for the reason it first looks
  #    like.** The 2026-09-15 issuance was watched: Caddy solved `tls-alpn-01` on 443 and
  #    never touched 80, so "port 80 is how the certificate is obtained" is false as written.
  #    What 80 actually carries is the automatic HTTP->HTTPS redirect (a real 308, verified)
  #    and the `http-01` FALLBACK — the path Caddy takes when tls-alpn-01 is unavailable,
  #    which is a condition that arrives without warning (a CA disabling the challenge type,
  #    a middlebox, a future Caddy default). Closing 80 therefore breaks nothing visible on
  #    the day it is closed, and removes the spare tyre from a renewal ~60 days later. That
  #    is the most expensive shape a config mistake can have, so it is written down here
  #    rather than inferred from the fact that everything still worked.
  caddy:
    image: caddy:2-alpine
    container_name: bb-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - bb
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── The two exporters this project used to BORROW ─────────────────────────────────────
  #
  # `monitoring/prometheus/prometheus.yml` scraped the box owner's `docker-cadvisor-1` and
  # `docker-node-exporter-1` — the right trade on hardware we did not own (a second
  # privileged cAdvisor mounting `/`, `/sys` and `/dev/kmsg` on somebody else's machine, to
  # recompute numbers that already existed one DNS name away), and a trade with a stated
  # cost: if that team stopped or renamed either container, every infra panel emptied.
  # Nothing to borrow here, so the cost is gone and so is the dependency.
  obs-cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: bb-cadvisor
    restart: unless-stopped
    # Not defaults. cAdvisor's out-of-the-box housekeeping is once per second over every
    # cgroup on the machine, which on a 2-vCPU box is a monitoring agent as the largest
    # single CPU consumer — measurement changing what it measures. 30s is well inside
    # Prometheus's own 30s scrape interval, `--docker_only` drops the raw-cgroup series
    # nothing here graphs, and container LABELS as metric labels is the standard way to
    # give a time series unbounded cardinality.
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=false
    # cAdvisor reads cgroup and container state straight off the host. Same mount set the
    # borrowed box's own copy ran with, which is also what keeps `dashboards/infra.json`'s
    # queries working unchanged across the move.
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - bb
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # `--path.rootfs=/rootfs` STRIPS that prefix from the `mountpoint` label, so the root
  # filesystem reports as `/` and not `/rootfs`. That is not cosmetic: `infra.json`'s disk
  # panel selects `mountpoint="/"`, and the borrowed node-exporter ran with the same flag —
  # so this line is what keeps that panel showing a series instead of silently nothing.
  obs-node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: bb-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/rootfs
      - --web.listen-address=0.0.0.0:9100
    pid: host
    volumes:
      - /:/rootfs:ro,rslave
    expose:
      - "9100"
    networks:
      - bb
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# Named rather than bind-mounted, deliberately — see the second bullet of the file header.
volumes:
  loki-data:
  alloy-data:
  prometheus-data:
  grafana-data:
  # Caddy's ACME account key and issued certificates. Clearing this is not free — it means
  # re-issuing every certificate on the next boot against Let's Encrypt's rate limit.
  caddy-data:
  caddy-config:

networks:
  # Ours, created by this project. It was `external: true, name: docker_default` for as
  # long as the reverse proxy belonged to somebody else and we had to be reachable on their
  # network to be proxied at all. Both halves of that are gone: `caddy` above is in this
  # file, on this network, and no container outside this project can resolve any name here.
  bb:
    driver: bridge
