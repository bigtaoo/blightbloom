# Metrics for the "server status" half of the dashboards. Logs answer *what happened*;
# this answers *how the box and the containers are doing while it happens*.
#
# **It used to run no exporters of its own, and that was the right call at the time.** The
# borrowed box already ran cAdvisor (container CPU/memory/restarts) and node-exporter (host
# CPU/RAM/disk/load) for its owner's stack, both on the shared `docker_default` network, and
# both measuring the WHOLE machine — our containers included. Standing up a second
# privileged cAdvisor there, mounting `/`, `/sys`, `/var/run` and `/dev/kmsg` a second time
# on hardware this project did not own, to recompute numbers that already existed one DNS
# name away, would have been a bad trade.
#
# It came with a stated cost: if that team stopped or renamed either container, the `host`
# and `containers` jobs went DOWN and every infra panel emptied while the log half kept
# working. Since 2026-09-15 the box is this project's own (server/deploy/README.md), so
# there is nothing to borrow, nobody else to depend on, and `docker-compose.yml` runs both
# exporters itself. The two jobs below now point at our own containers.
#
# `dashboards/infra.json` still graphs `up` for every target, which is what keeps a dead
# exporter visible as a target that is down rather than as a panel that quietly shows zero.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  external_labels:
    project: blightbloom

scrape_configs:
  # ── This project's own processes ──────────────────────────────────────────────────────
  # `/metrics` on each service (server/src/metrics.ts) — process uptime/RSS plus the few
  # numbers only the application knows: rooms in flight, queue depth, whether billsvc is
  # still in dev-stub mode. The backup worker serves no port and is therefore absent here;
  # its liveness is its container healthcheck, and its freshness is in `status.json`.
  - job_name: services
    metrics_path: /metrics
    static_configs:
      - targets: [gameserver:8787]
        labels: { svc: gameserver }
      - targets: [matchsvc:8788]
        labels: { svc: matchsvc }
      - targets: [billsvc:8789]
        labels: { svc: billsvc }

  # ── Ours since the move to dedicated hardware (see the header) ────────────────────────
  # The job names are unchanged on purpose: every panel in `dashboards/infra.json` selects
  # on them, and the series are the same ones cAdvisor and node-exporter always produced.
  # Only the address moved.
  - job_name: containers
    static_configs:
      - targets: [obs-cadvisor:8080]
  - job_name: host
    static_configs:
      - targets: [obs-node-exporter:9100]

  # ── The observability stack watching itself ───────────────────────────────────────────
  # Without this, "Loki stopped ingesting" is indistinguishable from "nothing happened",
  # which is the failure mode funny lived with for months (an empty Grafana that looked
  # like a quiet week).
  - job_name: obs
    static_configs:
      - targets: [obs-loki:3100]
        labels: { svc: loki }
      - targets: [obs-alloy:12345]
        labels: { svc: alloy }
      - targets: [obs-prometheus:9090]
        labels: { svc: prometheus }
